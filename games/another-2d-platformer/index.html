<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Another 2D Platformer, a free pixel-art platform game by DejaVu Softworks.">
  <meta name="theme-color" content="#132f3c">
  <title>Another 2D Platformer | DejaVu Softworks</title>
  <link rel="icon" href="../../assets/another-2d-platformer/a2dp_icon.png">
  <link rel="stylesheet" href="../../styles.css">
  <script src="../../scripts.js" defer></script>
</head>
<body>
  <header class="hero game-hero">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="../../">DejaVu Softworks</a>
      <div class="nav-links">
        <a href="../../privacy.html">Privacy Policy</a>
      </div>
    </nav>
    <div class="hero-content">
      <img class="title-art" src="../../assets/another-2d-platformer/a2dp_title.png" alt="Another 2D Platformer">
      <a class="button" href="https://play.google.com/store/apps/details?id=com.DejaVuSoftworks.Another2DPlatformer">Get it on Google Play</a>
    </div>
  </header>

  <main>
    <section class="section intro" aria-labelledby="about-title">
      <h1 id="about-title">Run. Jump. Explore.</h1>
      <p>Help the hero complete a mission across 16 unique levels. Run, jump, dodge enemies and collect coins as each stage brings a new challenge.</p>
      <p>Can you earn three stars on every level?</p>
    </section>

    <section class="section" aria-labelledby="screenshots-title">
      <h2 id="screenshots-title">Screenshots</h2>
      <div class="gallery">
        <img src="../../assets/another-2d-platformer/a2dp_1.png" alt="Another 2D Platformer gameplay screenshot 1" loading="lazy">
        <img src="../../assets/another-2d-platformer/a2dp_2.png" alt="Another 2D Platformer gameplay screenshot 2" loading="lazy">
        <img src="../../assets/another-2d-platformer/a2dp_3.png" alt="Another 2D Platformer gameplay screenshot 3" loading="lazy">
        <img src="../../assets/another-2d-platformer/a2dp_4.png" alt="Another 2D Platformer gameplay screenshot 4" loading="lazy">
        <img src="../../assets/another-2d-platformer/a2dp_5.png" alt="Another 2D Platformer gameplay screenshot 5" loading="lazy">
        <img src="../../assets/another-2d-platformer/a2dp_6.png" alt="Another 2D Platformer gameplay screenshot 6" loading="lazy">
        <img src="../../assets/another-2d-platformer/a2dp_7.png" alt="Another 2D Platformer gameplay screenshot 7" loading="lazy">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 DejaVu Softworks</p>
  </footer>
</body>
</html>
