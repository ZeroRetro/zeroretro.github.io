<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shield Defender, an arcade reflex game by DejaVu Softworks.">
  <meta name="theme-color" content="#132f3c">
  <title>Shield Defender | DejaVu Softworks</title>
  <link rel="icon" href="../../assets/shield-defender/sd_icon.png">
  <link rel="stylesheet" href="../../styles.css">
  <script src="../../scripts.js" defer></script>
</head>
<body>
  <header class="hero game-hero">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="../../">DejaVu Softworks</a>
      <div class="nav-links">
        <a href="../../privacy.html">Privacy Policy</a>
      </div>
    </nav>
    <div class="hero-content">
      <img class="title-art" src="../../assets/shield-defender/sd_title.png" alt="Shield Defender">
      <a class="button" href="https://play.google.com/store/apps/details?id=com.DejaVuSoftworks.ShieldDefender">Get it on Google Play</a>
    </div>
  </header>

  <main>
    <section class="section intro" aria-labelledby="about-title">
      <h1 id="about-title">Defend. React. Improve.</h1>
      <p>Shield Defender is an arcade-style game with simple, fast gameplay. Test your reflexes and defend yourself against the four enemies that constantly shoot at you.</p>
    </section>

    <section class="section" aria-labelledby="screenshots-title">
      <h2 id="screenshots-title">Screenshots</h2>
      <div class="gallery portrait-gallery">
        <img src="../../assets/shield-defender/sd_1.png" alt="Shield Defender gameplay screenshot 1" loading="lazy">
        <img src="../../assets/shield-defender/sd_2.png" alt="Shield Defender gameplay screenshot 2" loading="lazy">
        <img src="../../assets/shield-defender/sd_3.png" alt="Shield Defender gameplay screenshot 3" loading="lazy">
        <img src="../../assets/shield-defender/sd_4.png" alt="Shield Defender gameplay screenshot 4" loading="lazy">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 DejaVu Softworks</p>
  </footer>
</body>
</html>
